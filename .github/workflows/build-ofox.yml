name: Build OrangeFox

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: OrangeFox manifest branch
        required: true
        default: fox_16.0
        type: string
      rom_name:
        description: Short name used in the artifact name
        required: true
        default: saios
        type: string
      vendor_boot_url:
        description: Optional URL of a matching base vendor_boot image for automatic repack
        required: false
        type: string
      vendor_boot_sha256:
        description: SHA-256 of vendor_boot_url (optional)
        required: false
        type: string
      decrypted_data:
        description: Strip FBE flags from recovery.fstab /data during repack (true for saiOS)
        required: false
        default: true
        type: boolean
      blob_archive_url:
        description: Optional URL of a tar.gz or zip archive containing device-tree-relative ROM blobs
        required: false
        type: string
      blob_archive_sha256:
        description: SHA-256 of blob_archive_url (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: orangefox-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      FOX_MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git
      FOX_MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
      ROM_NAME: ${{ inputs.rom_name }}
      OFOX_DIR: /home/runner/orangefox

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/share/miniconda \
            /usr/local/julia* \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /var/lib/docker || true
          sudo apt-get clean || true
          df -h

      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libncurses-dev libssl-dev libxml2-utils lz4 \
            pngcrush python3 rsync schedtool squashfs-tools unzip xsltproc \
            zip zlib1g-dev
          sudo apt-get clean

      - name: Configure git & install repo
        shell: bash
        run: |
          git config --global user.name "saiquer"
          git config --global user.email "saiquer@users.noreply.github.com"
          git config --global color.ui false
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo

      - name: Sync OrangeFox source
        shell: bash
        run: |
          mkdir -p "$OFOX_DIR"
          cd "$OFOX_DIR"
          repo init --depth=1 --no-repo-verify -u "$FOX_MANIFEST_URL" -b "$FOX_MANIFEST_BRANCH" </dev/null
          repo sync -c --no-clone-bundle --no-tags --force-sync --optimized-fetch -j"$(nproc --all)"
          df -h

      - name: Install this device tree
        shell: bash
        run: |
          tree="$OFOX_DIR/device/xiaomi/degas"
          mkdir -p "$(dirname "$tree")"
          rm -rf "$tree"
          mkdir -p "$tree"
          rsync -a --exclude .git --exclude .github --exclude rom-blobs --exclude orangefox \
            "$GITHUB_WORKSPACE/" "$tree/"
          chmod +x "$tree/recovery/root/system/bin/"*.sh "$tree/patch_touch_clean.sh"

      - name: Overlay ROM blobs from the fork
        shell: bash
        run: |
          set -euo pipefail
          tree="$OFOX_DIR/device/xiaomi/degas"

          if [ -d "$GITHUB_WORKSPACE/rom-blobs" ]; then
            rsync -a --exclude README.md \
              "$GITHUB_WORKSPACE/rom-blobs/" "$tree/"
          fi

          url='${{ inputs.blob_archive_url }}'
          if [ -n "$url" ]; then
            archive="$RUNNER_TEMP/rom-blobs"
            curl -fL --retry 3 "$url" -o "$archive"
            if [ -n '${{ inputs.blob_archive_sha256 }}' ]; then
              echo '${{ inputs.blob_archive_sha256 }}  '"$archive" | sha256sum -c -
            fi
            mkdir -p "$RUNNER_TEMP/blob-extract"
            case "$url" in
              *.zip|*.zip?*) unzip -q "$archive" -d "$RUNNER_TEMP/blob-extract" ;;
              *) tar -xf "$archive" -C "$RUNNER_TEMP/blob-extract" ;;
            esac
            rsync -a "$RUNNER_TEMP/blob-extract/" "$tree/"
          fi

      - name: Apply device patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in "$OFOX_DIR/device/xiaomi/degas/patches/bootable/recovery/"*.patch; do
            if git -C "$OFOX_DIR/bootable/recovery" apply --reverse --check "$patch" 2>/dev/null; then
              echo "already applied: $(basename "$patch")"
            else
              git -C "$OFOX_DIR/bootable/recovery" apply "$patch"
              echo "applied: $(basename "$patch")"
            fi
          done

      - name: Free prebuilt git packfiles & enable 24G swap before compile
        shell: bash
        run: |
          # Keep git metadata for bootable/recovery & vendor/recovery; drop redundant packfiles elsewhere
          find "$OFOX_DIR/.repo/project-objects" -mindepth 1 -maxdepth 2 \
            ! -path '*/bootable*' ! -path '*/vendor*' -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$OFOX_DIR/.repo/projects/prebuilts" /opt/hostedtoolcache || true
          # Prevent systemd-oomd / kernel OOM killer from killing Android 16 soong_build on 16GB RAM
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile || true
          SWAP_FILE="/swapfile"
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')" -ge 26 ]; then
            SWAP_FILE="/mnt/swapfile"
          fi
          sudo fallocate -l 24G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          sudo sysctl -w vm.swappiness=60 2>/dev/null || true
          free -h
          df -h

      - name: Build OrangeFox vendor_boot
        shell: bash
        run: |
          set -eo pipefail
          cd "$OFOX_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=degas
          export OF_MAINTAINER=saiquer
          export _JAVA_OPTIONS="-Xmx4g"
          source build/envsetup.sh
          lunch ofox_degas-bp2a-eng
          if type mka >/dev/null 2>&1; then
            mka vendorbootimage
          else
            m -j"$(nproc --all)" vendorbootimage
          fi
          df -h

      - name: Optional repack onto base vendor_boot
        shell: bash
        run: |
          set -euo pipefail
          tree="$OFOX_DIR/device/xiaomi/degas"
          base_img="$tree/ofox_degas-vendor_boot.img"
          url='${{ inputs.vendor_boot_url }}'
          if [ -n "$url" ]; then
            curl -fL --retry 3 "$url" -o "$base_img"
          elif [ -f "$GITHUB_WORKSPACE/rom-blobs/ofox_degas-vendor_boot.img" ]; then
            cp "$GITHUB_WORKSPACE/rom-blobs/ofox_degas-vendor_boot.img" "$base_img"
          fi

          if [ -f "$base_img" ]; then
            if [ -n '${{ inputs.vendor_boot_sha256 }}' ]; then
              echo '${{ inputs.vendor_boot_sha256 }}  '"$base_img" | sha256sum -c -
            fi
            BUILD_TOP="$OFOX_DIR" \
            MODBASE="$base_img" \
            FRESH="$OFOX_DIR/out/target/product/degas/vendor_boot.img" \
            OUTIMG="$tree/ofox_degas-vendor_boot-clean.img" \
            DECRYPTED_DATA='${{ inputs.decrypted_data && 1 || 0 }}' \
              bash "$tree/patch_touch_clean.sh"
          else
            echo "No base vendor_boot provided; uploading freshly compiled out/target/product/degas/vendor_boot.img for local repack."
          fi

      - name: Collect outputs & checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$OFOX_DIR/out/target/product/degas/vendor_boot.img" \
            "$RUNNER_TEMP/artifacts/ofox_degas-raw-vendor_boot.img"
          if [ -f "$OFOX_DIR/device/xiaomi/degas/ofox_degas-vendor_boot-clean.img" ]; then
            cp "$OFOX_DIR/device/xiaomi/degas/ofox_degas-vendor_boot-clean.img" \
              "$RUNNER_TEMP/artifacts/ofox_degas-vendor_boot-clean.img"
          fi
          (cd "$RUNNER_TEMP/artifacts" && sha256sum *.img > SHA256SUMS && cat SHA256SUMS)

      - name: Upload recovery images
        uses: actions/upload-artifact@v4
        with:
          name: ofox-degas-${{ env.ROM_NAME }}-${{ github.run_number }}
          if-no-files-found: error
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 14
